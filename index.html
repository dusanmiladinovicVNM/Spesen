<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Spesenerfassung</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121212;
  --feld:#262626;
  --akzent:#8FA426;
  --text:#F0F0F0;
  --grau:#969696;
  --rand:#464646;
  --fehler:#C84040;
  --pad:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  color:var(--text);
  font-family:"Open Sans",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;
  line-height:1.35;
  overscroll-behavior-y:none;
}

/* ---------- ekrani ---------- */
.screen{display:none;flex-direction:column;height:100%;align-items:center}
.screen.aktiv{display:flex}
.scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 var(--pad) calc(24px + env(safe-area-inset-bottom));
}

/* Na telefonu bez efekta; na desktopu drži formular u koloni
   umjesto da se razvuče preko cijelog ekrana. */
.scroll,.login-wrap,.kopf,.kopf-liste,.total{
  width:100%;max-width:480px;margin-left:auto;margin-right:auto;
}

/* ---------- zaglavlje ---------- */
.kopf{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 12px;
  flex:none;
}
.kopf .name{font-weight:600;font-size:15px}
.kopf img{height:40px;width:auto;display:block}

.kopf-liste{
  display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) var(--pad) 4px;
  flex:none;
}
.kopf-liste h1{margin:0;font-size:18px;font-weight:600}
.zurueck{
  background:none;border:0;padding:4px;margin-left:-4px;
  color:var(--akzent);font-size:22px;line-height:1;cursor:pointer;
}
.total{
  padding:0 var(--pad) 12px;text-align:right;font-size:13px;color:var(--grau);
  flex:none;
}

/* ---------- polja ---------- */
label{display:block;font-size:13px;margin:12px 0 4px}
input,select,textarea{
  width:100%;height:48px;padding:0 12px;
  background:var(--feld);color:var(--text);
  border:1px solid var(--rand);border-radius:4px;
  font-family:inherit;font-size:15px;
  appearance:none;-webkit-appearance:none;
}
textarea{height:88px;padding:12px;resize:none;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--akzent)}
input::placeholder,textarea::placeholder{color:var(--grau)}
select{
  padding-right:40px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1 1l6 6 6-6' fill='none' stroke='%238FA426' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;
}
input[type=date]{min-height:48px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.5)}

.zeile2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.zeile2 label{grid-column:1 / -1;margin-bottom:4px}

.vorschau{font-size:13px;color:var(--grau);min-height:20px;margin:12px 0 0}

/* ---------- dugmad ---------- */
button.gross{
  width:100%;height:48px;border-radius:4px;
  font-family:inherit;font-size:15px;font-weight:700;
  cursor:pointer;border:1px solid transparent;
}
.primaer{background:var(--akzent);color:#000;border-color:var(--akzent)}
.primaer:active{background:#7d9021}
.primaer:disabled{opacity:.45;cursor:default}
.sekundaer{background:transparent;color:var(--text);border-color:var(--rand)}
.sekundaer:active{background:#1d1d1d}
.knopfzeile{margin-top:20px;display:flex;flex-direction:column;gap:12px}

/* ---------- lista ---------- */
.liste{padding:0 0 24px}
.eintrag{
  display:grid;grid-template-columns:1fr auto auto;
  column-gap:12px;align-items:center;
  padding:12px 0;border-bottom:1px solid rgba(255,255,255,.08);
}
.eintrag .oben{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600}
.eintrag .unten{font-size:11px;color:var(--grau);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.eintrag .zellen{min-width:0}
.storno{
  background:none;border:0;padding:8px;cursor:pointer;
  color:var(--grau);font-size:16px;line-height:1;
}
.storno.scharf{color:var(--fehler)}
.leer{color:var(--grau);text-align:center;padding:48px 0;font-size:14px}

/* ---------- prijava ---------- */
.login-wrap{
  flex:1;display:flex;flex-direction:column;justify-content:center;
  padding:0 var(--pad) 48px;
}
.login-wrap img{height:56px;width:auto;align-self:center;margin-bottom:32px}
.login-wrap h1{font-size:20px;font-weight:600;margin:0 0 4px;text-align:center}
.login-wrap p.sub{font-size:13px;color:var(--grau);margin:0 0 24px;text-align:center}

/* ---------- poruke ---------- */
.meldung{
  margin-top:12px;font-size:13px;padding:10px 12px;border-radius:4px;
  display:none;
}
.meldung.zeigen{display:block}
.meldung.ok{background:rgba(143,164,38,.15);color:var(--akzent)}
.meldung.err{background:rgba(200,64,64,.15);color:#E88}

.toast{
  position:fixed;left:var(--pad);right:var(--pad);
  bottom:calc(20px + env(safe-area-inset-bottom));
  background:var(--feld);border:1px solid var(--rand);border-radius:4px;
  padding:12px 14px;font-size:14px;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:opacity .18s,transform .18s;z-index:50;
}
.toast.zeigen{opacity:1;transform:none}
.toast.ok{border-color:var(--akzent)}
.toast.err{border-color:var(--fehler)}

/* ---------- dijalog ---------- */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:none;align-items:center;justify-content:center;padding:24px;z-index:100;
}
.overlay.zeigen{display:flex}
.box{
  background:var(--feld);border:1px solid var(--rand);border-radius:8px;
  padding:20px;width:100%;max-width:420px;
}
.box p{margin:0 0 20px;font-size:14px;line-height:1.45}
.box .knopfzeile{margin:0}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>

<!-- ============ PRIJAVA ============ -->
<section id="scr-login" class="screen aktiv">
  <div class="login-wrap">
    <img src="logo.svg" alt="">
    <h1>Spesenerfassung</h1>
    <p class="sub">Bitte melden Sie sich an</p>

    <label for="lg-email">Benutzername</label>
    <input id="lg-email" type="email" inputmode="email" autocomplete="username"
           autocapitalize="off" placeholder="name@firma.ch">

    <label for="lg-pass">Passwort</label>
    <input id="lg-pass" type="password" autocomplete="current-password">

    <div id="lg-meldung" class="meldung err"></div>

    <div class="knopfzeile">
      <button id="lg-senden" class="gross primaer">Anmelden</button>
    </div>
  </div>
</section>

<!-- ============ ERFASSUNG ============ -->
<section id="scr-form" class="screen">
  <header class="kopf">
    <span class="name" id="fm-name"></span>
    <img src="logo.svg" alt="">
  </header>

  <div class="scroll">
    <div class="zeile2">
      <label>Monat / Jahr</label>
      <select id="fm-monat"></select>
      <select id="fm-jahr"></select>
    </div>

    <label for="fm-belegnr">Beleg-Nr.</label>
    <input id="fm-belegnr" type="text" placeholder="optional" autocapitalize="characters">

    <label for="fm-datum">Datum</label>
    <input id="fm-datum" type="date">

    <label for="fm-brutto">Betrag brutto</label>
    <input id="fm-brutto" type="text" inputmode="decimal" placeholder="0.00">

    <label for="fm-mwst">MWSt-Satz</label>
    <select id="fm-mwst">
      <option value="0">0%</option>
      <option value="2.6">2,6%</option>
      <option value="3.8">3,8%</option>
      <option value="8.1" selected>8,1%</option>
    </select>

    <label for="fm-konto">Konto</label>
    <select id="fm-konto"></select>

    <label for="fm-kst">Kostenstelle</label>
    <select id="fm-kst"></select>

    <label for="fm-bemerkung">Bemerkung</label>
    <textarea id="fm-bemerkung" placeholder="Lieferant, Ort, Zweck"></textarea>

    <p class="vorschau" id="fm-vorschau"></p>

    <div class="knopfzeile">
      <button id="fm-speichern" class="gross primaer">Speichern</button>
      <button id="fm-liste" class="gross sekundaer">Belege anzeigen</button>
      <button id="fm-abmelden" class="gross sekundaer">Abmelden</button>
    </div>
  </div>
</section>

<!-- ============ ÜBERSICHT ============ -->
<section id="scr-list" class="screen">
  <header class="kopf-liste">
    <button class="zurueck" id="lst-zurueck" aria-label="Zurück">&#8592;</button>
    <h1 id="lst-titel">Belege</h1>
  </header>
  <div class="total" id="lst-total"></div>
  <div class="scroll">
    <div class="liste" id="lst-liste"></div>
  </div>
</section>

<!-- ============ DIJALOG ZA DUPLIKAT ============ -->
<div class="overlay" id="dlg-dup">
  <div class="box">
    <p>Ein Beleg mit gleichem Datum, Betrag und gleicher Beleg-Nr. ist bereits
       erfasst. Ist dies ein zweiter, anderer Beleg?</p>
    <div class="knopfzeile">
      <button id="dup-ja" class="gross primaer">Ja, trotzdem erfassen</button>
      <button id="dup-nein" class="gross sekundaer">Abbrechen</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
